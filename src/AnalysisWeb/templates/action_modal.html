<div class="action-modal-content">
    <h3>
        Select Action for <span id="modal-model-type"></span>
    </h3>

    <p>Choose what you want to do with this model:</p>

    <div class="checkbox-container" style="margin-bottom: 20px;">
        <div
            id="job-flags-container"
            style="display: flex; align-items: center; justify-content: center; gap: 20px;"
        >
            <!-- Checkboxes generated from config -->
        </div>
    </div>

    <div class="action-button-container">
        <button
            class="action-btn action-btn-run"
            data-action="re-run"
            data-action-key="run_script"
        >
            Run Script
        </button>

        <button class="action-btn action-btn-cancel">
            Cancel
        </button>
    </div>
</div>
